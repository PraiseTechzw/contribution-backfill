name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify 10,000-record fixture
        run: |
          python scripts/generate_fixture.py --count 10000 --output /tmp/contribution-fixture.md
          test "$(wc -l < /tmp/contribution-fixture.md)" -eq 10000
